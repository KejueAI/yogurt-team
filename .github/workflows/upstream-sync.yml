# Yogurt Team: once a day, merge FrigadeHQ/yogurt's main into a pull request so CI checks it before anyone merges.
# A conflict leaves the pull request with the conflict to resolve by hand (FORK.md lists every upstream file the fork edits).
name: Upstream sync

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into a branch
        id: merge
        run: |
          git config user.name "yogurt-team-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/FrigadeHQ/yogurt.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then echo "up to date"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git checkout -B upstream-sync
          if git merge --no-edit upstream/main; then echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            git reset --hard upstream/main
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # GitHub won't let Actions push changes to .github/workflows/; those merges are done by hand
          if ! git push -f origin upstream-sync 2>push.err; then
            cat push.err
            grep -q "workflows. permission" push.err || exit 1
            echo "manual=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask for a manual merge
        if: steps.merge.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="Upstream changed files under .github/workflows/, which GitHub doesn't let Actions push. Merge it locally: git fetch upstream && git merge upstream/main && git push (FORK.md lists the files the fork edits)."
          open=$(gh issue list --state open --search "Sync with upstream Yogurt in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Sync with upstream Yogurt" --body "$body"; fi
      - name: Open or update the pull request
        if: steps.merge.outputs.changed == 'true' && steps.merge.outputs.manual != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="Merges FrigadeHQ/yogurt main. Check FORK.md's list of edited upstream files if anything conflicts."
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            body="Upstream main conflicts with the fork. This branch is upstream/main alone: merge it locally (git merge upstream/main) and resolve using FORK.md."
          fi
          gh pr view upstream-sync >/dev/null 2>&1 && exit 0
          gh pr create --head upstream-sync --base main --title "Sync with upstream Yogurt" --body "$body" && exit 0
          # Organizations can forbid Actions from opening pull requests; fall back to an issue with the compare link
          link="${{ github.server_url }}/${{ github.repository }}/compare/main...upstream-sync?expand=1"
          open=$(gh issue list --state open --search "Sync with upstream Yogurt in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "Updated: $link"
          else gh issue create --title "Sync with upstream Yogurt" --body "$(printf '%s\n\nOpen the pull request: %s' "$body" "$link")"; fi
